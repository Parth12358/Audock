name: tests

# Regression (~100) + seeded synthetic (~1,400) suites on every push and PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run suites
        run: tests/run.sh
